[manifest]
version = "1.0.0"
priority = 1

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = "if amt > 0 or amt < 0 then"
position = 'at'
payload = "if to_big(amt) > to_big(0) or to_big(amt) < to_big(0) then"
match_indent = true

[[patches]]
[patches.pattern]
target = '''engine/event.lua'''
pattern = '''        other = {}'''
position = "after"
payload = ''',
para_desc = {}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = "if  SMODS.calculate_round_score()  > 0 then"
position = 'at'
payload = "if to_big(SMODS.calculate_round_score()) > to_big(0) then"
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "if args.operation == '-' and scalar_value < 0 then scalar_value = scalar_value * -1 end"
position = 'at'
payload = "if args.operation == '-' and to_big(scalar_value) < to_big(0) then scalar_value = scalar_value * -1 end"
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
pattern = "SMODS.Sticker = SMODS.GameObject:extend {"
position = 'after'
payload = '''extend = function(self, proto)
    local newclass = SMODS.GameObject.extend(self, proto)
    newclass.para_sticker_extension = true
    return newclass
end,'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/misc_functions.lua'
pattern = "G.ARGS.LOC_COLOURS = G.ARGS.LOC_COLOURS or {"
position = 'at'
payload = "G.ARGS.LOC_COLOURS = {"
match_indent = true

# Pyrite Ring sell button displays an accurate number
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "self.sell_cost_label = self.facing == 'back' and '?' or self.sell_cost"
position = 'at'
payload = "self.sell_cost_label = self.facing == 'back' and '?' or ((self.ability.para_item and self.ability.para_item.key == 'i_para_pyrite_ring') and self.sell_cost - self.ability.para_item.ability.extra.bonus_value or self.sell_cost)"
match_indent = true

# Pyrite Ring sells for the right amount
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "ease_dollars(self.sell_cost)"
position = 'at'
payload = '''if self.ability.para_item and self.ability.para_item.key == 'i_para_pyrite_ring' then ease_dollars(self.sell_cost - self.ability.para_item.ability.extra.bonus_value)
else ease_dollars(self.sell_cost)
end'''
match_indent = true